# =============================================================================
# TEST CONFIG — smoke test: 1 sample per geometry family, single scale bucket.
# Derived from production config.yaml. Only scale/sampling/calibration blocks
# are modified; everything else (material, geometry params, load_scaling,
# linearity_gate, splitting, validation, solver, output) is copied verbatim.
# =============================================================================

material:
  E: 210.0e+9
  nu: 0.3
  sigma_yield: 420.0e+6
  UTS: 480.0e+6

scale:
  characteristic_length_range: [0.02, 2.0]
  mesh_size_fraction: 0.05
  buckets: ["small"]
  bucket_boundaries: [0.02, 2.0]

geometry:
  families:
    - block_with_holes
    - l_bracket
    - elongated_bar
    - block_with_fillet
  family_weights: [0.25, 0.25, 0.25, 0.25]

block_with_holes:
  base_dims_range: [0.8, 1.2]
  hole_count_range: [1, 4]
  hole_radius_fraction: [0.05, 0.20]
  aspect_ratio_range: [0.5, 2.0]

l_bracket:
  notch_depth_fraction: [0.25, 0.50]
  notch_width_fraction: [0.25, 0.50]
  radius_ratio_range: [0.02, 0.30]
  radius_ratio_holdout: [0.10, 0.20]

elongated_bar:
  min_aspect_ratio: 8.0
  max_aspect_ratio: 15.0
  cross_section_aspect: [0.5, 2.0]
  hole_probability: 0.4



block_with_fillet:
  fillet_radius_fraction: [0.05, 0.25]
  num_fillets_range: [1, 4]

load_scaling:
  stress_percentile: 95
  safety_factor_targets: [1.2, 1.5, 2.0, 3.0, 5.0]
  peak_stress_cap: 432.0e+6

linearity_gate:
  bulk_families: [block_with_holes, block_with_fillet, l_bracket]
  bending_families: [elongated_bar]
  bulk_threshold: 0.05
  bending_length_threshold: 0.05
  bending_thickness_threshold: 0.5

sampling:
  min_base_samples_per_stratum: 1
  total_target_base_samples: 5
  random_seed: 42

splitting:
  ratios: [0.80, 0.10, 0.10]
  large_scale_holdout_fraction: 0.5

calibration:
  pilot_samples: 5
  linearity_verification_sample_rate: 0.01
  linearity_tolerance: 0.01
  max_family_failure_rate: 0.05

validation:
  coherence_tolerance: 0.05
  coherence_tolerance_overrides:
    elongated_bar: 0.065   # bending family, ~5.8% observed + margin
  max_local_strain_diagnostic: 0.02
  max_graph_diameter_warning: null
  min_multihot_samples: 50

solver:
  element_degree: 2
  reference_load_magnitude: 50.0

output:
  hdf5_dir: "output/raw"
  geometry_dir: "output/geometries"
  manifest_path: "output/manifest.csv"
  log_dir: "logs"
  progress_interval: 1
